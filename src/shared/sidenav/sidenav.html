<mat-nav-list>
  @for (item of menuItems; track item.route) {
    <a
      mat-list-item
      [routerLink]="item.route"
      routerLinkActive="active-link"
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      matTooltip="{{ item.label }}"
    >
      <mat-icon matListItemIcon>
        {{ item.icon }}
      </mat-icon>
    </a>
  }
</mat-nav-list>
