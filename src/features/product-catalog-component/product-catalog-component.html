<h3>Available Products</h3>

<mat-form-field appearance="outline" class="search-field">
  <mat-label> Search Product </mat-label>

  <input
    matInput
    [ngModel]="search()"
    (ngModelChange)="search.set($event)"
    placeholder="Name or Code"
  />

  <mat-icon matSuffix> search </mat-icon>
</mat-form-field>

<div class="category-list">
  <button
    [matButton]="selectedCategory() === 'All' ? 'filled' : 'outlined'"
    [class.selected]="selectedCategory() === 'All'"
    (click)="selectCategory('All')"
  >
    All
  </button>

  @for (category of productCategories; track category) {
    <button
      [matButton]="selectedCategory() === category ? 'filled' : 'outlined'"
      (click)="selectCategory(category)"
    >
      {{ category }}
    </button>
  }
</div>
<div class="products-grid">
  @for (product of filteredProducts(); track product.productCode) {
    <mat-card class="product-card" role="button" (click)="addProductToOrder(product)">
      <mat-card-content>
        <div class="product-name">
          {{ product.productName }}
        </div>

        <div class="product-code">Code : {{ product.productCode }}</div>
      </mat-card-content>
    </mat-card>
  } @empty {
    <div class="empty-state">No products found.</div>
  }
</div>
