<mat-card class="billing-card">
  <mat-card-content>
    <form class="billing-form" [formGroup]="billingForm" (ngSubmit)="add()">
      <mat-form-field appearance="outline">
        <mat-label>Product Code </mat-label>

        <input
          #productInput
          matInput
          formControlName="productCode"
          (keydown.enter)="focusQuantity($event)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>

        <input
          #quantityInput
          matInput
          type="number"
          formControlName="quantity"
          (keydown.enter)="submitFromQuantity($event)"
        />
      </mat-form-field>
    </form>
  </mat-card-content>
</mat-card>

<app-product-catalog></app-product-catalog>
