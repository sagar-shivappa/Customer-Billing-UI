<mat-card>
  <mat-card-header>
    <mat-card-title>Add Product</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="productForm" (ngSubmit)="addProduct()">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Product Name</mat-label>
          <input
            #productNameInput
            matInput
            formControlName="productName"
            (keydown.enter)="focusProductCode($event)"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Product Code</mat-label>
          <input
            #productCodeInput
            matInput
            formControlName="productCode"
            (keydown.enter)="focusCategory($event)"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Category</mat-label>

          <mat-select #categoryInput formControlName="category" (selectionChange)="focusPrice()">
            @for (category of categories; track category) {
              <mat-option [value]="category">
                {{ category }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Price</mat-label>
          <input
            #priceInput
            matInput
            type="number"
            formControlName="price"
            (keydown.enter)="submitFromPrice($event)"
          />
        </mat-form-field>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<app-product-catalog></app-product-catalog>
